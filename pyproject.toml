[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchgood-ops-copilot"
version = "0.1.0"
description = "Human-in-the-loop AI operations prototype"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
rag = [
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=3,<4",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
ui = [
    "streamlit>=1.37,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
