services:
  - type: web
    name: launchgood-ops-copilot-backend
    env: python
    buildCommand: pip install -e .[api]
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
